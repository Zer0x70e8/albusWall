[loggers]
keys=root,tzlocal,albuswall.configue

[handlers]
keys=consoleHandler

[formatters]
keys=detailedFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_tzlocal]
level=WARNING
handlers=
qualname=tzlocal

[logger_albuswall.configue]
level=WARNING
handlers=
qualname=albuswall.configue

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=detailedFormatter
args=()

[formatter_detailedFormatter]
class=albuswall.log.formatters.MultilineFormatter
format=%(asctime)s.%(msecs)03d - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
