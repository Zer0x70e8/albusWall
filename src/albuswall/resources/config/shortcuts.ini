# albuswall default keyboard shortcuts
#
# Loaded by albuswall.ui.keymap (ShortcutConfig / ShortcutRegistry.load).
# User overrides live in <user_config_dir>/shortcuts.ini and win per command.
# This file is declarative data only: a command fires once something
# registers that command path as a shortcut slot.
#
# Shorthand (used below):  command.path = ["key", ...]
# Full record (used by save()):
#   command.path = [keys, positional_args, keyword_args]
#   e.g. album.open = ["Alt+1", [1], {"mode": "fit"}]
#        keys: string for one key, array for many; args: JSON array;
#        kwargs: JSON object. All three are passed to the shortcut slot.
#
# Three key forms (Qt PortableText):
#   single key          "F5"
#   modifier + key      "Ctrl+Shift+P"
#   chord (multi-step)  "G, G"          <- comma separates chord steps
#
# One command may list several keys; one key may be bound to several
# commands (write the same key under different commands).
# An empty list [] explicitly unbinds a default.

[shortcuts]

# -- application -------------------------------------------------------
app.quit            = ["Ctrl+Q"]
app.settings        = ["Ctrl+,"]

# -- window / view -----------------------------------------------------
window.fullscreen   = ["F11", "Ctrl+Shift+F"]
window.close        = ["Ctrl+W"]
view.zoom_in        = ["Ctrl++", "Ctrl+="]
view.zoom_out       = ["Ctrl+-"]
view.reset          = ["Ctrl+0"]

# -- content / view ----------------------------------------------------
content.search      = ["Ctrl+F"]

# -- albums / assets ---------------------------------------------------
album.new           = ["Ctrl+N"]
album.rename        = ["F2"]
asset.favorite      = ["Space"]
asset.delete        = ["Delete"]
