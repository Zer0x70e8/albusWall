[project]
name = "albuswall"
version = "0.1.3"
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.2.2", # Viewing system resource information, used for resource allocation.
    "apscheduler>=3.10.0", # Scheduler, Timer.
    "pillow>=12.3.0",
    "pyside6>=6.11.2",
]

[project.optional-dependencies]
ui = [
    "pyside6>=6.11.2", # Default UI.
]
all = [
    "pyside6>=6.11.2",
]


# tool
[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F", # pyflakes  ← 抓未使用变量/未定义名
    "I", # isort     ← 导入排序
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # bugbear   ← 抓可变默认值、循环里 return 等
    "SIM", # simplify  ← 抓 `if x: return True else: return False`
    "T20", # 禁止 print  ← 你的 album.py 有残留
    "RUF", # ruff 专属
]
ignore = ["E501"]  # 交给 formatter

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/window/source/detail_widget.py" = ["E402"]  # __main__ 段
