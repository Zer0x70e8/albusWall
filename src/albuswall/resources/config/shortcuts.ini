# albuswall default keyboard shortcuts
#
# Loaded by albuswall.ui.keymap (ShortcutConfig / ShortcutRegistry.load).
# User overrides live in <user_config_dir>/shortcuts.ini and win per command.
# This file is declarative data only: a command fires once something
# registers that command path as a shortcut slot (the built-in UI registers
# every command below -- see albuswall.ui.presenter.shortcuts).
#
# Shorthand (used below):  command.path = ["key", ...]
# Full record (used by save()):
#   command.path = [keys, positional_args, keyword_args]
#   e.g. album.open = ["Alt+1", [1], {"mode": "fit"}]
#        keys: string for one key, array for many# args: JSON array;
#        kwargs: JSON object. All three are passed to the shortcut slot.
# An empty list [] unbinds the command: it still exists (code can call it),
# it just has no key. That is how the "unbound by default" entries below are
# written -- replace [] with a key list to switch them on.
#
# Three key forms (Qt PortableText):
#   single key          "F5"
#   modifier + key      "Ctrl+Shift+P"
#   chord (multi-step)  "G, G"          <- comma separates chord steps
#
# Key aliases match by identity, not by text, so write whichever spelling you
# like: "Delete" / "Del", "Enter" / "Return", "Escape" / "Esc",
# "Shift+Tab" / "Shift+Backtab" / "Backtab" mean the same physical key.
#
# Keys the widget layer keeps for itself are never taken by the binder, even
# if bound here: Tab / arrows / Home / End / PgUp / PgDn / Esc (the focus
# chain and the window's Esc layers), and Space / Enter while the focus is in
# a text input or on a widget that declares `keymap_passthrough` (buttons,
# the content grid, checkable groups). Give commands a modifier combination:
# bare Space would be eaten by the grid's quick preview, which is why
# asset.favorite sits on Ctrl+D.
#
# One command may list several keys# one key may be bound to several
# commands (write the same key under different commands).

# [shortcuts]
# 
# # -- application -------------------------------------------------------
# app.quit            = ["Ctrl+Q"]
# app.settings        = ["Ctrl+,"]
# 
# # -- window / layers ---------------------------------------------------
# # Toggle fullscreen.
# window.fullscreen   = ["F11", "Ctrl+Shift+F"]
# # Close the topmost layer# with no layer open it closes the window.
# window.close        = ["Ctrl+W"]
# # Show / hide the album page -- unbound by default, e.g. ["Ctrl+1"].
# window.album        = []
# # Show / hide the import-source page -- unbound by default, e.g. ["Ctrl+2"].
# window.source       = []
# 
# # -- content / view ----------------------------------------------------
# # Detail-page zoom: in, out, and fit-to-window.
# view.zoom_in        = ["Ctrl++", "Ctrl+="]
# view.zoom_out       = ["Ctrl+-"]
# view.reset          = ["Ctrl+0"]
# # Step through the album inside the detail page -- unbound by default,
# # e.g. ["Alt+Right"] and ["Alt+Left"].
# viewer.next         = []
# viewer.prev         = []
# # Focus the search bar.
# content.search      = ["Ctrl+F"]
# # Quick-preview the asset under the grid cursor -- unbound by default,
# # e.g. ["Ctrl+Return"].
# content.preview     = []
# 
# # -- albums / assets ---------------------------------------------------
# album.new           = ["Ctrl+N"]
# album.rename        = ["F2"]
# asset.favorite      = ["Ctrl+D"]
# # Take the current asset out of the trash -- unbound by default,
# # e.g. ["Ctrl+R"].
# asset.restore       = []
# # Move the current asset into the trash (normalised to "Del").
# asset.delete        = ["Delete"]

# ======================================================================
# More things a record can say. Nothing below is active: the entries are
# commented out# the user file (<config>/shortcuts.ini) is the place for
# real overrides.
# ======================================================================
# One command, several keys:
## window.fullscreen = ["F11", "Ctrl+Shift+F", "Ctrl+Super+F"]
# One key, several commands (repeat the same key under each command):
## content.search = ["Ctrl+F"]
## window.album   = ["Ctrl+F"]
# A chord (the comma separates steps# the comma key itself is "Ctrl+,"):
## app.settings = ["Ctrl+K, Ctrl+S"]
# A full record with fixed arguments -- the handler is called as
# handler(1, mode="fit") whenever the key fires:
## album.open = ["Alt+1", [1], {"mode": "fit"}]
# Explicitly unbinding a default (same as the [] entries above):
## asset.delete = []
