# albuswall configuration file
# ${section:key} is expanded at runtime, e.g. ${path:config} -> ~/.config/albuswall

; debug = false


[path]
# Root directory for themes; fallback when ui.style_sheet is empty.
theme = ${path:config}/theme
; # Absolute icon dir (optional). If empty, derived from
; # ${style_sheet's parent}/${files:icons}.
; icon = ${theme}/icon


[files]
# Referenced by [log] config.
log = log_config.ini
# Database file name.
db = db.db
# Referenced by [ui] style_sheet.
qss = qss.qss
# Glob pattern for icon files inside the built-in theme's icon/ directory.
# Used by ensure_theme_files_completed() to select which icons to copy.
icons = *.svg


[log]
# Resolves to ~/.config/albuswall/log_config.ini.
config = ${path:config}/${files:log}
# TRACE / DEBUG / INFO / WARNING / ERROR / CRITICAL or number.
level = WARNING


; [db]
; # false: create if missing. true: error if missing.
; must_exist = false


[ui]
# Interface language. Bundled translations live in resources/i18n/;
# missing translations fall back to the source text (the app keeps running).
; language = zh_CN
# Active theme name; also selects resources/themes/<name> as the source.
theme = default
# "builtin" = bundled UI implementation.
ui = builtin
; # true = do not load any bundled UI resources.
; no_builtin = false
; # Resolves to ~/.config/albuswall/default/qss.qss.
; # Auto-completed from the built-in theme if missing.
; # style_sheet = ${path:config}/theme/${theme}/${files:qss}
; style_sheet = ${path:theme}/${files:qss}

; # --- theme auto-completion (ui/builtin/config/typed.py) ---
; # Master switch; false = do nothing.
; auto_complete_theme = true
; # Whether to copy a missing QSS.
; auto_complete_qss = true
; # Whether to copy missing icons.
; auto_complete_icons = true
; # true: only on first run. After the first copy, a marker is written to
; #   <theme_dir>/.albuswall_theme_initialized
; #   and missing files are never restored again. Delete the marker (or set
; #   this to false) to re-enable completion.
; # false: check and complete on every startup.
; auto_complete_only_once = true


; =====================================================================
; Service-layer sections.
;
; Defaults and types live in the services' own ConfigField declarations
; (services/thumbnail/config.py, services/import_.py,
;  services/source_trash/bootstrap.py); the dict shapes handed to the
; services are described in services/schema.py (TypedDict) and loaded
; with albuswall.configue.typed.load_typed.
;
; Every value below is the declared default -- uncomment a line to
; override it. Fields left commented simply fall back to the default.
; =====================================================================

; [thumbnail]
; # Private-mode root for generated thumbnails (ignored when xdg_enabled).
; thumb_root = ~/.cache/albuswall/thumbs
; # true  -> $XDG_CACHE_HOME/thumbnails, the freedesktop shared cache
; #          (other apps and file managers reuse these thumbs);
; # false -> <thumb_root>, albuswall's own cache.
; # Both modes use the same on-disk layout (<root>/<spec>/<md5>.png),
; # so switching only changes the root directory.
; xdg_enabled = false
; # How many candidates the thumbnail worker takes per batch.
; batch_size = 32
; # Seconds a permanently failed asset is skipped before a retry.
; failure_cooldown_sec = 300.0
; # Disk-write retries on a transient error, plus the linear backoff
; # base in seconds (retry n waits n * write_retry_backoff_sec).
; write_max_retries = 2
; write_retry_backoff_sec = 0.2
; # Reserved: output is always PNG, so changing these does nothing.
; image_format = JPEG
; quality = 85
; # Dict values are written as one JSON object on a single line.
; # Keys must be existing spec names (small / medium / large).
; specs = {"small": 128, "medium": 512, "large": 1024}
; # Empty (the default) = built-in map: normal / x-large / xx-large.
; xdg_spec_map = {"small": "normal", "medium": "x-large", "large": "xx-large"}

; [import]
; # Pending candidates imported per round.
; batch_size = 500
; # Seconds to wait for one candidate in the process pool (the worker
; # gives up and marks it failed; the child process is not killed).
; process_timeout = 600.0
; # Worker backoff after an exception: starts at initial_backoff and
; # doubles on each consecutive failure up to max_backoff (seconds).
; initial_backoff = 1.0
; max_backoff = 60.0

; [source_trash]
; # Name and scheduling of the trash reconciler.
; reconciler_name = source_trash
; priority = 8
; # Debounce (seconds) between a change signal and the next scan.
; debounce = 1.0
; # Orphan-thumbnail cleanup: true / false forces it on / off, empty
; # (the default) means "decide by platform".
; xdg_compat =
; # Age (seconds) an orphan thumbnail must reach before it is deleted;
; # protects thumbnails that were written moments ago.
; orphan_min_age_seconds = 600.0
; # Empty = <platform cache dir>/albuswall/.session. The marker records
; # whether the last shutdown was clean.
; session_marker_path =
; # true: after an unclean shutdown, purge orphan thumbnails on boot.
; auto_cleanup_on_dirty = true
; # true: remove now-empty spec directories after deleting thumbnails.
; prune_empty_dirs = true
